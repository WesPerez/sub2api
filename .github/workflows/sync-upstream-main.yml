name: Sync Main With Upstream

on:
  schedule:
    # Daily at 03:17 Asia/Shanghai.
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-with-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main from upstream/main
    if: github.repository == 'WesPerez/sub2api'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure upstream
        run: |
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git || git remote set-url upstream https://github.com/Wei-Shaw/sub2api.git

      - name: Fast-forward main to upstream
        run: |
          set -euo pipefail
          expected="$(git rev-parse origin/main)"
          git fetch upstream main
          git checkout main
          if ! git merge-base --is-ancestor origin/main upstream/main; then
            echo "::error::origin/main contains commits not present in upstream/main; refusing to overwrite fork-only history"
            exit 1
          fi
          git merge --ff-only upstream/main
          git push origin HEAD:main --force-with-lease=refs/heads/main:"${expected}"
